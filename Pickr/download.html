<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04060a">
<meta name="apple-itunes-app" content="app-id=6813511457">
<title>在 App Store 下载 Pickr</title>
<meta name="description" content="前往你所在国家或地区的 App Store 下载 Pickr（适用于 iPhone 与 iPad）。">
<link rel="icon" type="image/webp" sizes="256x256" href="assets/icon-256.webp">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #04060a;
    --card: linear-gradient(138deg, rgba(255, 255, 255, 0.088) 0%, rgba(255, 255, 255, 0.028) 52%, rgba(255, 255, 255, 0.056) 100%);
    --pill: rgba(255, 255, 255, 0.085);
    --ink: #f5f5f7;
    --muted: #9a9aa2;
    --accent: #0a84ff;
    --accent-link: #5eb0ff;
    --border: rgba(255, 255, 255, 0.115);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-color: var(--bg);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
      "PingFang SC", "PingFang TC", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -8%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle 460px at 24% 22%, rgba(28, 96, 218, 0.36) 0%, rgba(16, 52, 132, 0.16) 46%, transparent 72%),
      radial-gradient(circle 420px at 78% 30%, rgba(182, 94, 32, 0.3) 0%, rgba(108, 46, 16, 0.14) 46%, transparent 72%),
      radial-gradient(circle 460px at 50% 78%, rgba(24, 118, 178, 0.28) 0%, transparent 72%);
    filter: blur(30px);
    -webkit-filter: blur(30px);
  }
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    background: var(--card);
    backdrop-filter: saturate(195%) blur(36px);
    -webkit-backdrop-filter: saturate(195%) blur(36px);
    border-radius: 28px;
    padding: 40px 32px 32px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 26px 64px rgba(0, 0, 0, 0.56), inset 0 1px 0 rgba(255, 255, 255, 0.15), inset 1px 0 0 rgba(255, 255, 255, 0.06);
  }
  .icon {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    margin: 0 auto 20px;
    display: block;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .status {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 50px;
    padding: 0 24px;
    border-radius: 980px;
    background: var(--ink);
    color: #090b10;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    transition: transform 0.15s ease, background-color 0.15s ease;
  }
  .btn:hover { background: #ffffff; }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .regions-label {
    margin-top: 28px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .regions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .region-pill {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 980px;
    background: var(--pill);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .region-pill:hover,
  .region-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .back {
    display: inline-block;
    margin-top: 24px;
    font-size: 14px;
    color: var(--accent-link);
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent-link); outline-offset: 4px; }
  .back { min-height: 44px; padding-block: 10px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
    body::before { display: none; }
    .card { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="assets/icon-256.webp" width="76" height="76" alt="Pickr">
    <h1 id="title">下载 Pickr</h1>
    <p class="status" id="status">点按按钮前往 App Store，或选择其他地区商店</p>

    <a class="btn" id="primary-btn" href="https://apps.apple.com/app/id6813511457">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
      </svg>
      <span id="btn-text">前往 App Store 下载</span>
    </a>

    <p class="regions-label" id="regions-label">或选择其他地区商店：</p>
    <div class="regions" id="regions">
      <a class="region-pill" data-store="cn" href="https://apps.apple.com/cn/app/pickr/id6813511457">中国大陆</a>
      <a class="region-pill" data-store="hk" href="https://apps.apple.com/hk/app/pickr/id6813511457">中國香港</a>
      <a class="region-pill" data-store="tw" href="https://apps.apple.com/tw/app/pickr/id6813511457">台灣</a>
      <a class="region-pill" data-store="us" href="https://apps.apple.com/us/app/pickr-photos/id6813511457">United States</a>
      <a class="region-pill" data-store="jp" href="https://apps.apple.com/jp/app/pickr/id6813511457">日本</a>
      <a class="region-pill" data-store="kr" href="https://apps.apple.com/kr/app/pickr/id6813511457">대한민국</a>
    </div>

    <a class="back" id="back-link" href="index.html">← 返回 Pickr 官网</a>
  </main>

  <script src="assets/site-routing.js?v=20261022-review1"></script>
  <script>
  (function () {
    var UI_COPY = {
      "zh-Hans": {
        title: "下载 Pickr",
        status: "适用于 iPhone 与 iPad · 点按下方按钮前往 App Store",
        btn: "在 App Store 下载 Pickr",
        other: "切换其他国家或地区商店：",
        back: "← 返回 Pickr 官网"
      },
      "zh-Hant": {
        title: "下載 Pickr",
        status: "適用於 iPhone 與 iPad · 點按下方按鈕前往 App Store",
        btn: "在 App Store 下載 Pickr",
        other: "切換其他國家或地區商店：",
        back: "← 返回 Pickr 官網"
      },
      en: {
        title: "Download Pickr",
        status: "For iPhone and iPad · Continue to the App Store below",
        btn: "Download on the App Store",
        other: "Or choose another storefront:",
        back: "← Back to Pickr website"
      },
      ja: {
        title: "Pickr をダウンロード",
        status: "iPhone・iPad 対応 · 下のボタンから App Store へ",
        btn: "App Store からダウンロード",
        other: "その他の国・地域のストア：",
        back: "← Pickr 公式サイトへ戻る"
      },
      ko: {
        title: "Pickr 다운로드",
        status: "iPhone 및 iPad 지원 · 아래 버튼으로 App Store 열기",
        btn: "App Store에서 다운로드",
        other: "다른 국가 또는 지역 스토어 선택:",
        back: "← Pickr 웹사이트로 돌아가기"
      }
    };

    function resolveTarget() {
      var params = new URLSearchParams(location.search);
      return { uiLang: PickrRouting.readLanguage(), store: params.get("store"), url: PickrRouting.storeURL(params.get("store")) };
    }

    var target = resolveTarget();
    var copy = UI_COPY[target.uiLang] || UI_COPY.en;
    document.documentElement.lang = target.uiLang;
    document.title = copy.btn + " · Pickr";
    document.getElementById("title").textContent = copy.title;
    document.getElementById("status").textContent = copy.status;
    document.getElementById("btn-text").textContent = copy.btn;
    document.getElementById("regions-label").textContent = copy.other;
    document.getElementById("back-link").textContent = copy.back;
    document.getElementById("back-link").href = "index.html?lang=" + encodeURIComponent(target.uiLang);

    var btn = document.getElementById("primary-btn");
    btn.href = target.url;

    var pills = document.querySelectorAll(".region-pill");
    for (var i = 0; i < pills.length; i++) {
      if (pills[i].getAttribute("data-store") === target.store) {
        pills[i].classList.add("active");
      }
    }

  })();
  </script>
</body>
</html>
