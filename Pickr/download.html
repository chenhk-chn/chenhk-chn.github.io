<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfbfd">
<meta name="apple-itunes-app" content="app-id=6813511457">
<title>在 App Store 下载 Pickr</title>
<meta name="description" content="前往你所在国家或地区的 App Store 下载 Pickr（适用于 iPhone 与 iPad）。">
<link rel="icon" type="image/webp" sizes="256x256" href="assets/icon-256.webp">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<style>
  :root {
    --bg: #fbfbfd;
    --card: #ffffff;
    --pill: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --border: rgba(0, 0, 0, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
      "PingFang SC", "PingFang TC", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border-radius: 28px;
    padding: 40px 32px 32px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
  }
  .icon {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    margin: 0 auto 20px;
    display: block;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .status {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 50px;
    padding: 0 24px;
    border-radius: 980px;
    background: var(--ink);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.92; }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .regions-label {
    margin-top: 28px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .regions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .region-pill {
    display: inline-flex;
    align-items: center;
    min-height: 34px;
    padding: 0 14px;
    border-radius: 980px;
    background: var(--pill);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .region-pill:hover,
  .region-pill.active {
    background: var(--accent);
    color: #fff;
  }
  .back {
    display: inline-block;
    margin-top: 24px;
    font-size: 14px;
    color: var(--accent);
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="assets/icon-256.webp" width="76" height="76" alt="Pickr">
    <h1 id="title">正在打开 App Store…</h1>
    <p class="status" id="status">为您匹配所在国家或地区的 App Store 商店页面</p>

    <a class="btn" id="primary-btn" href="https://apps.apple.com/cn/app/pickr/id6813511457">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
      </svg>
      <span id="btn-text">前往 App Store 下载</span>
    </a>

    <p class="regions-label" id="regions-label">或选择其他地区商店：</p>
    <div class="regions" id="regions">
      <a class="region-pill" data-store="cn" href="https://apps.apple.com/cn/app/pickr/id6813511457">中国大陆</a>
      <a class="region-pill" data-store="hk" href="https://apps.apple.com/hk/app/pickr/id6813511457">中國香港</a>
      <a class="region-pill" data-store="tw" href="https://apps.apple.com/tw/app/pickr/id6813511457">台灣</a>
      <a class="region-pill" data-store="us" href="https://apps.apple.com/us/app/pickr-photos/id6813511457">United States</a>
      <a class="region-pill" data-store="jp" href="https://apps.apple.com/jp/app/pickr/id6813511457">日本</a>
      <a class="region-pill" data-store="kr" href="https://apps.apple.com/kr/app/pickr/id6813511457">대한민국</a>
    </div>

    <a class="back" id="back-link" href="index.html">← 返回 Pickr 官网</a>
  </main>

  <script>
  (function () {
    var APP_ID = "6813511457";
    var STORE_URLS = {
      cn: "https://apps.apple.com/cn/app/pickr/id" + APP_ID,
      hk: "https://apps.apple.com/hk/app/pickr/id" + APP_ID,
      tw: "https://apps.apple.com/tw/app/pickr/id" + APP_ID,
      us: "https://apps.apple.com/us/app/pickr-photos/id" + APP_ID,
      gb: "https://apps.apple.com/gb/app/pickr-photos/id" + APP_ID,
      au: "https://apps.apple.com/au/app/pickr-photos/id" + APP_ID,
      ca: "https://apps.apple.com/ca/app/pickr-photos/id" + APP_ID,
      jp: "https://apps.apple.com/jp/app/pickr/id" + APP_ID,
      kr: "https://apps.apple.com/kr/app/pickr/id" + APP_ID,
      fr: "https://apps.apple.com/fr/app/pickr/id" + APP_ID,
      de: "https://apps.apple.com/de/app/pickr/id" + APP_ID,
      es: "https://apps.apple.com/es/app/pickr/id" + APP_ID,
      it: "https://apps.apple.com/it/app/pickr/id" + APP_ID
    };

    var UI_COPY = {
      "zh-Hans": {
        title: "正在打开 App Store…",
        status: "适用于 iPhone 与 iPad · 已为您匹配当前地区商店",
        btn: "在 App Store 下载 Pickr",
        other: "切换其他国家或地区商店：",
        back: "← 返回 Pickr 官网"
      },
      "zh-Hant": {
        title: "正在打開 App Store…",
        status: "適用於 iPhone 與 iPad · 已為您配對目前地區商店",
        btn: "在 App Store 下載 Pickr",
        other: "切換其他國家或地區商店：",
        back: "← 返回 Pickr 官網"
      },
      en: {
        title: "Opening the App Store…",
        status: "Pickr for iPhone and iPad · Matched to your regional storefront",
        btn: "Download on the App Store",
        other: "Or choose another storefront:",
        back: "← Back to Pickr website"
      },
      ja: {
        title: "App Store を開いています…",
        status: "iPhone・iPad 対応 · お住まいの地域のストアへ移動します",
        btn: "App Store からダウンロード",
        other: "その他の国・地域のストア：",
        back: "← Pickr 公式サイトへ戻る"
      },
      ko: {
        title: "App Store 여는 중…",
        status: "iPhone 및 iPad 지원 · 현재 지역의 스토어로 이동합니다",
        btn: "App Store에서 다운로드",
        other: "다른 국가 또는 지역 스토어 선택:",
        back: "← Pickr 웹사이트로 돌아가기"
      }
    };

    function resolveTarget() {
      var params = new URLSearchParams(window.location.search);
      var explicitStore = (params.get("store") || "").toLowerCase();
      var rawLang = params.get("lang") || "";
      if (!rawLang) {
        try { rawLang = localStorage.getItem("pickr.lang") || ""; } catch (_) {}
      }
      if (!rawLang) {
        rawLang = (navigator.languages && navigator.languages[0]) || navigator.language || "zh-CN";
      }
      var lower = String(rawLang).toLowerCase();
      var tz = "";
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (_) {}

      var uiLang = "en";
      var store = "us";

      if (lower.indexOf("zh-hk") === 0 || lower.indexOf("zh-mo") === 0 || tz === "Asia/Hong_Kong" || tz === "Asia/Macau") {
        uiLang = "zh-Hant";
        store = "hk";
      } else if (lower.indexOf("zh-tw") === 0 || lower.indexOf("zh-hant") === 0 || tz === "Asia/Taipei") {
        uiLang = "zh-Hant";
        store = "tw";
      } else if (lower.indexOf("zh") === 0 || tz === "Asia/Shanghai" || tz === "Asia/Chongqing" || tz === "Asia/Urumqi") {
        uiLang = "zh-Hans";
        store = "cn";
      } else if (lower.indexOf("ja") === 0 || tz === "Asia/Tokyo") {
        uiLang = "ja";
        store = "jp";
      } else if (lower.indexOf("ko") === 0 || tz === "Asia/Seoul") {
        uiLang = "ko";
        store = "kr";
      } else if (lower.indexOf("en-gb") === 0 || tz === "Europe/London") {
        uiLang = "en";
        store = "gb";
      } else if (lower.indexOf("en-au") === 0) {
        uiLang = "en";
        store = "au";
      } else if (lower.indexOf("en-ca") === 0) {
        uiLang = "en";
        store = "ca";
      } else if (lower.indexOf("fr") === 0) {
        uiLang = "en";
        store = "fr";
      } else if (lower.indexOf("de") === 0) {
        uiLang = "en";
        store = "de";
      } else if (lower.indexOf("es") === 0) {
        uiLang = "en";
        store = "es";
      } else if (lower.indexOf("it") === 0) {
        uiLang = "en";
        store = "it";
      }

      if (explicitStore && STORE_URLS[explicitStore]) {
        store = explicitStore;
      }

      return { uiLang: uiLang, store: store, url: STORE_URLS[store] || STORE_URLS.cn };
    }

    var target = resolveTarget();
    var copy = UI_COPY[target.uiLang] || UI_COPY.en;
    document.documentElement.lang = target.uiLang;
    document.title = copy.btn + " · Pickr";
    document.getElementById("title").textContent = copy.title;
    document.getElementById("status").textContent = copy.status;
    document.getElementById("btn-text").textContent = copy.btn;
    document.getElementById("regions-label").textContent = copy.other;
    document.getElementById("back-link").textContent = copy.back;
    document.getElementById("back-link").href = "index.html?lang=" + encodeURIComponent(target.uiLang);

    var btn = document.getElementById("primary-btn");
    btn.href = target.url;

    var pills = document.querySelectorAll(".region-pill");
    for (var i = 0; i < pills.length; i++) {
      if (pills[i].getAttribute("data-store") === target.store) {
        pills[i].classList.add("active");
      }
    }

    var params = new URLSearchParams(window.location.search);
    if (params.get("stay") !== "1") {
      setTimeout(function () {
        window.location.replace(target.url);
      }, 180);
    }
  })();
  </script>
</body>
</html>
