<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骰子示例：一页会动的说明书</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 28px 20px 120px; max-width: 640px;
    font: -apple-system, 17px/1.75, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #faf7f1; color: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) { body { background: #171512; color: #f0ece4; } }
  h1 { font-size: 26px; line-height: 1.35; margin: 0 0 6px; }
  .meta { color: #6f6a60; font-size: 14px; margin: 0 0 24px; }
  nav { margin-bottom: 24px; }
  nav a {
    color: #2f6a4f; text-decoration: none; font-size: 15px;
    padding: 6px 12px; border: 1px solid #2f6a4f55; border-radius: 999px;
  }
  @media (prefers-color-scheme: dark) { nav a { color: #8fd0ac; border-color: #8fd0ac55; } }
  .stage {
    padding: 24px 20px 20px; border-radius: 24px; text-align: center;
    background: #ffffff; box-shadow: 0 1px 3px #00000014, 0 12px 28px #0000000d;
  }
  @media (prefers-color-scheme: dark) {
    .stage { background: #211e1a; box-shadow: 0 1px 3px #00000000, 0 12px 28px #00000040; }
  }
  .count-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
  .count-row button, .roll {
    font: inherit; cursor: pointer; border-radius: 999px;
  }
  .count-row button {
    border: 1px solid #2f6a4f44; background: transparent; color: inherit;
    padding: 6px 16px; font-size: 15px;
  }
  .count-row button.on { background: #2f6a4f; border-color: #2f6a4f; color: #fff; }
  @media (prefers-color-scheme: dark) {
    .count-row button { border-color: #8fd0ac44; }
    .count-row button.on { background: #8fd0ac; border-color: #8fd0ac; color: #171512; }
  }
  .dice-row { display: flex; gap: 16px; justify-content: center; min-height: 96px; }
  .die {
    width: 88px; height: 88px; padding: 12px; border: 0; border-radius: 20px;
    background: linear-gradient(#ffffff, #efe9df);
    box-shadow: 0 3px 0 #00000012, inset 0 -3px 0 #0000000a;
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .45s cubic-bezier(.2, .8, .3, 1.15);
  }
  @media (prefers-color-scheme: dark) {
    .die { background: linear-gradient(#f4efe6, #ddd5c7); }
  }
  .die.rolling { animation: tumble .55s ease; }
  @keyframes tumble {
    30% { transform: rotate(-13deg) translateY(-7px) scale(1.04); }
    65% { transform: rotate(9deg) translateY(-2px); }
  }
  .pip {
    width: 14px; height: 14px; border-radius: 50%;
    background: #2b2620; place-self: center; opacity: 0;
    transition: opacity .12s;
  }
  .pip.on { opacity: 1; }
  .roll {
    margin-top: 22px; padding: 12px 44px; font-size: 17px; font-weight: 600;
    background: #2f6a4f; border: 0; color: #fff;
  }
  @media (prefers-color-scheme: dark) { .roll { background: #8fd0ac; color: #171512; } }
  .roll:active { transform: translateY(1px); }
  .verdict { min-height: 30px; margin: 16px 0 4px; font-size: 16px; color: #4a463e; }
  @media (prefers-color-scheme: dark) { .verdict { color: #c7c1b5; } }
  .verdict strong { color: #2f6a4f; }
  @media (prefers-color-scheme: dark) { .verdict strong { color: #8fd0ac; } }
  .history { min-height: 26px; margin: 0; font-size: 14px; color: #6f6a60; }
  .history span {
    display: inline-block; margin: 2px 3px; padding: 2px 10px;
    border-radius: 999px; background: #2f6a4f14;
  }
  section { margin-top: 28px; }
  h2 { font-size: 19px; margin: 0 0 10px; }
  p, li { margin: 0 0 12px; }
  ul { padding-left: 20px; margin: 0 0 14px; }
  .top {
    position: fixed; right: 16px; bottom: 96px; text-decoration: none;
    width: 44px; height: 44px; border-radius: 50%; text-align: center; line-height: 44px;
    background: #2f6a4f; color: #fff; font-size: 18px;
  }
  @media (prefers-color-scheme: dark) { .top { background: #8fd0ac; color: #171512; } }
  @media (prefers-reduced-motion: reduce) {
    .die { transition: none; }
    .die.rolling { animation: none; }
  }
</style>
</head>
<body id="top">
<h1>骰子示例：一页会动的说明书</h1>
<p class="meta">示例内容 · 互动演示 · 约 1 分钟</p>
<nav><a href="#how">玩法与原理</a></nav>

<div class="stage" role="group" aria-label="骰子桌">
  <div class="count-row" role="group" aria-label="骰子数量">
    <button type="button" data-n="1">1 颗</button><button type="button" data-n="2" class="on">2 颗</button><button type="button" data-n="3">3 颗</button>
  </div>
  <div class="dice-row" id="dice"></div>
  <button class="roll" type="button" id="roll">掷一把</button>
  <p class="verdict" id="verdict" aria-live="polite">点「掷一把」，或者直接点骰子。</p>
  <p class="history" id="history"></p>
</div>

<section id="how">
  <h2>玩法与原理</h2>
  <ul>
    <li><strong>这一页本身就是一篇文章。</strong>没有服务器，也没有任何外部资源——下载这一个文件，就拥有了整个演示，离线照玩。</li>
    <li><strong>点数字换颗数，点骰子或按钮开掷。</strong>几颗相同叫「豹子」，连号叫「顺子」，其余看总点数的大小。</li>
    <li><strong>深色模式与减弱动效都照顾到了。</strong>系统切深色它跟着变；开启「减弱动态效果」时，骰子安静地翻面。</li>
  </ul>
  <p>把它想成 Agent 能发布的任何小工具页：计算器、投票、速查表——凡是装得进一个 HTML 文件的，都能进你的阅读列表。</p>
</section>

<a class="top" href="#top" aria-label="回到顶部">↑</a>

<script>
(function () {
  var PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  var count = 2, rolling = false, history = [];
  var diceRow = document.getElementById('dice');
  var verdict = document.getElementById('verdict');
  var historyEl = document.getElementById('history');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  function makeDie() {
    var die = document.createElement('button');
    die.type = 'button';
    die.className = 'die';
    die.setAttribute('aria-label', '骰子，点按投掷');
    for (var i = 0; i < 9; i++) {
      var pip = document.createElement('span');
      pip.className = 'pip';
      die.appendChild(pip);
    }
    die.addEventListener('click', roll);
    return die;
  }
  function face(die, value) {
    var on = PIPS[value] || [];
    var pips = die.children;
    for (var i = 0; i < 9; i++) pips[i].classList.toggle('on', on.indexOf(i) >= 0);
    die.setAttribute('aria-label', '骰子：' + value + ' 点，点按投掷');
  }
  function build() {
    diceRow.innerHTML = '';
    for (var i = 0; i < count; i++) { var die = makeDie(); face(die, i === 0 ? 3 : (i === 1 ? 3 : 5)); diceRow.appendChild(die); }
  }
  function judge(faces) {
    var sum = faces.reduce(function (a, b) { return a + b; }, 0);
    var same = faces.every(function (f) { return f === faces[0]; });
    var sorted = faces.slice().sort(function (a, b) { return a - b; });
    var straight = sorted.every(function (f, i) { return i === 0 || f === sorted[i - 1] + 1; });
    if (same && count > 1) return '<strong>豹子 ' + faces[0] + '！</strong>共 ' + sum + ' 点。';
    if (straight && count > 1) return '<strong>顺子！</strong>共 ' + sum + ' 点。';
    var mid = count * 3.5;
    return '共 <strong>' + sum + '</strong> 点' + (sum > mid ? '，偏大。' : sum < mid ? '，偏小。' : '。');
  }
  function roll() {
    if (rolling) return;
    rolling = true;
    verdict.textContent = '掷出去了……';
    var dice = [].slice.call(diceRow.children);
    dice.forEach(function (die) { die.classList.add('rolling'); });
    var flips = 0, timer = setInterval(function () {
      dice.forEach(function (die) { face(die, 1 + Math.floor(Math.random() * 6)); });
      flips++;
    }, 80);
    setTimeout(function () {
      clearInterval(timer);
      var faces = dice.map(function () { return 1 + Math.floor(Math.random() * 6); });
      dice.forEach(function (die, i) { die.classList.remove('rolling'); face(die, faces[i]); });
      verdict.innerHTML = judge(faces);
      history.unshift(faces.reduce(function (a, b) { return a + b; }, 0));
      history = history.slice(0, 5);
      historyEl.innerHTML = '最近：' + history.map(function (s) { return '<span>' + s + '</span>'; }).join('');
      rolling = false;
    }, reduceMotion.matches ? 120 : 560);
  }
  document.getElementById('roll').addEventListener('click', roll);
  [].forEach.call(document.querySelectorAll('.count-row button'), function (button) {
    button.addEventListener('click', function () {
      if (rolling) return;
      count = +button.dataset.n;
      [].forEach.call(document.querySelectorAll('.count-row button'), function (b) { b.classList.toggle('on', b === button); });
      build();
      verdict.textContent = '换成 ' + count + ' 颗，点「掷一把」。';
    });
  });
  build();
})();
</script>
</body>
</html>
